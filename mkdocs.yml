site_name: Clinical Informatics Open Curriculum
site_description: The Clinical Informatics Open Curriculum, an open-source course written for clinicians, trainees, and researchers.
site_url: https://clinical-informatics.github.io/
site_author: Mario David Felix, MD MHS
repo_url: https://github.com/clinical-informatics/clinical-informatics.github.io
repo_name: clinical-informatics
copyright: Creative Commons BY 4.0 (content), MIT (code). &copy; Mario David Felix, MD MHS.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.path
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/clinical-informatics
