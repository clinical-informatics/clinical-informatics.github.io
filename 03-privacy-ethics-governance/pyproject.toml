[project]
name = "clinical-informatics-03-privacy-ethics-governance"
version = "0.1.0"
description = "Course 03 of the clinical-informatics curriculum: Privacy, ethics, and governance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Mario David Felix, MD MHS" },
]
dependencies = [
    "marimo>=0.10.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "altair>=5.2.0",
    "plotly>=5.18.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "requests>=2.31.0",
    "fhirpy>=2.0.0",
    "pydantic>=2.6.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
